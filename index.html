<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Slab Kiutra Wiring Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a cryostat cross-section. Temperature stages run top to bottom as shaded bands,
   each wiring line is a vertical lane, and components sit on the plate they are anchored to. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #17202a;
  --muted: #5a6775;
  --rule: #c7d0d9;
  --accent: #1c64a6;
  --accent-ink: #ffffff;
  --cold: #6f88a3;
  --plate: #1f2a35;
  --lane-rf: #2b3947;
  --lane-dc: #7a5b2e;
  --lane-sc: #7b2fbf;
  --add: #1e7a46;
  --del: #b23a33;
  --warn-bg: #fff4d6;
  --warn-ink: #6b4a00;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #161d25; --ink: #e2e8ee; --muted: #93a1af; --rule: #2d3945;
    --accent: #6aafe8; --accent-ink: #0b1622; --cold: #3f6a95; --plate: #c3cdd7;
    --lane-rf: #b8c4cf; --lane-sc: #c79cf2; --lane-dc: #d1a462; --add: #5fc78b; --del: #f0877f;
    --warn-bg: #3a2f12; --warn-ink: #f1d58a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #161d25; --ink: #e2e8ee; --muted: #93a1af; --rule: #2d3945;
  --accent: #6aafe8; --accent-ink: #0b1622; --cold: #3f6a95; --plate: #c3cdd7;
  --lane-rf: #b8c4cf; --lane-sc: #c79cf2; --lane-dc: #d1a462; --add: #5fc78b; --del: #f0877f;
  --warn-bg: #3a2f12; --warn-ink: #f1d58a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.muted { color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
header.top h1 { font-size: 26px; font-weight: 700; letter-spacing: .01em; }
.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--add); }

nav.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 12px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .02em; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 6px 12px; border-radius: 6px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--del); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 3px 8px; font-size: 12px; }

.banner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; background: var(--warn-bg); color: var(--warn-ink); }
.banner.info { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }

/* Diagram */
.scroll { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); touch-action: pan-x pan-y;
  /* As wide and as tall as the diagram, so only the page scrolls. */
  overflow: hidden; width: max-content; min-width: 100%; box-sizing: border-box; }
.diagram { display: grid; position: relative; min-width: min-content; transform-origin: 0 0; }
.zoom-sizer { position: relative; overflow: hidden; }
/* Touch screens: phone browsers misplace their own scroll indicators while the zoom resizes the content,
   so the page draws its own, pinned to the box edges. Mouse and trackpad keep the native scrollbars. */
.scroll-wrap { position: relative; }
.sb { display: none; position: absolute; z-index: 3; border-radius: 3px; pointer-events: none; background: color-mix(in srgb, var(--ink) 50%, transparent); opacity: 0; transition: opacity .4s; }
.sb.x { height: 4px; bottom: 3px; }
.sb.y { width: 4px; right: 3px; }
.sb.on { opacity: 1; transition: none; }
@media (pointer: coarse) {
  .scroll { scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .sb { display: block; }
}
.band { grid-column: 1 / -1; }
.stage-label { grid-column: 1; padding: 8px 8px; overflow-wrap: anywhere; position: relative; z-index: 2; }
.stage-label .t { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.1; }
.stage-label .s { color: var(--muted); font-size: 12px; }
.plate-bar { grid-column: 2 / -1; align-self: center; height: 7px; background: var(--plate); z-index: 0; }
.plate-bar.thin { height: 3px; }
.lane { z-index: 0; position: relative; pointer-events: none; }
.lane::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-1px); background: var(--lane-rf); opacity: .55; }
.lane.dc::before { width: 8px; transform: translateX(-4px); opacity: .5; background: repeating-linear-gradient(90deg, var(--lane-dc) 0 1px, transparent 1px 2.33px); }
.lane.empty-end::before { bottom: 50%; }
/* A coax line that carries superconducting (NbTi) cable, i.e. an output line: its own colour and a heavier stroke, so it reads apart from the stainless input lines in grey print too. */
.lane.rf.sc::before { width: 3px; transform: translateX(-1.5px); background: var(--lane-sc); opacity: .85; }
.lhead { padding: 8px 4px 6px; text-align: center; z-index: 2; position: relative; border-bottom: 1px solid var(--rule); background: var(--surface); }
.lhead button { all: unset; cursor: pointer; display: block; width: 100%; border-radius: 4px; }
.lhead button:focus-visible { outline: 2px solid var(--accent); }
.lhead .n { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.lhead .p { font-size: 12px; color: var(--muted); line-height: 1.3; white-space: pre-line; }
.lhead .att { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--muted); }
.lhead.sel { box-shadow: inset 0 -3px 0 var(--accent); }
/* The line names again under the coldest stage, so a tall diagram reads from either end. */
.lhead.lfoot { padding: 6px 4px 8px; border-bottom: 0; border-top: 1px solid var(--rule); background: transparent; }
.lhead.lfoot.sel { box-shadow: inset 0 3px 0 var(--accent); }
.cell { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 5px 2px; position: relative; z-index: 1; min-height: 40px; }
.cell.region { min-height: 52px; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; max-width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 3px; align-items: center; padding: 3px 4px 3px 3px; border-radius: 4px; border: 1.5px solid var(--ink); background: var(--surface); font-size: 10px; line-height: 1.3; text-align: left; }
/* Symbols large, labels small: the symbol is what the eye scans the diagram for. */
.chip svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.chip .l { font-weight: 600; overflow-wrap: anywhere; }
.chip .d { grid-column: 2; color: var(--muted); font-size: 9px; overflow-wrap: anywhere; white-space: pre-line; }
.chip .d.link { color: var(--accent); }
.chip .d.clip { color: var(--accent); display: inline-flex; align-items: center; gap: 3px; }
.chip .d.clip svg { width: 11px; height: 11px; margin: 0; stroke-width: 1.8; }
.chip.anchor .d.clip { grid-column: 1; }
/* Connectors carry no symbol: the box on the plate already reads as one. */
.chip.connector { grid-template-columns: minmax(0, 1fr); padding: 3px 8px; }
.chip.connector .d, .chip.connector .d.clip { grid-column: 1; }
/* A circulator with isolators drawn as its parts, port 3 facing the line that feeds it. */
.chip.stacked { grid-template-columns: minmax(0, 1fr); text-align: center; }
.chip.stacked .d, .chip.stacked .d.clip { grid-column: 1; justify-content: center; }
.chip svg.stack { grid-column: 1 / -1; justify-self: center; margin: 2px 0 3px; stroke-width: 1.15; }
.chip svg.stack text { fill: currentColor; stroke: none; font-size: 7px; text-anchor: middle; font-family: var(--font-body); }
.lhead .dnu { color: var(--del); font-weight: 700; font-size: 12px; letter-spacing: .04em; line-height: 1.3; }

/* Datasheets and links on a component */
.atts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.atts li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 2px 8px; align-items: start; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); }
.atts svg { width: 16px; height: 16px; margin-top: 2px; stroke: var(--muted); fill: none; stroke-width: 1.6; }
.atts a { color: var(--accent); font-weight: 500; overflow-wrap: anywhere; text-decoration: none; }
.atts a:hover { text-decoration: underline; }
.atts .sub { grid-column: 2; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.atts input { width: 100%; padding: 3px 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); font-size: 13px; }
.att-add { display: grid; gap: 6px; padding: 8px; border: 1px dashed var(--rule); border-radius: 5px; }
.att-add .row { display: flex; flex-wrap: wrap; gap: 6px; }
.att-add input { flex: 1 1 140px; min-width: 0; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); }
/* Above the chips, so a curve reaches a port drawn inside its part. */
svg.links { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; overflow: visible; }
svg.links path { fill: none; stroke: var(--lane-rf); stroke-width: 2; opacity: .8; }
svg.links circle { fill: var(--lane-rf); }
.chip.cable { border-color: transparent; background: color-mix(in srgb, var(--surface) 82%, transparent); }
.chip.cable .l { font-weight: 500; }
.chip.attenuator .l { font-variant-numeric: tabular-nums; }
.chip.anchor { border-style: dashed; border-color: var(--muted); padding: 1px 6px; grid-template-columns: minmax(0, 1fr); }
.chip.anchor .d { grid-column: 1; }
.chip.anchor .l { font-weight: 500; color: var(--muted); }
.chip.sel { outline: 2.5px solid var(--accent); outline-offset: 1px; }
/* A puck port with nothing wired to it: red, so nobody connects to it. */
.chip.dnu { border-color: var(--del); border-width: 2px; color: var(--del); }
.chip.dnu .d { color: var(--del); }
.chip.changed { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.chip:focus-visible { outline: 2.5px solid var(--accent); }
.add { border: 1px dashed var(--muted); background: var(--surface); color: var(--muted); border-radius: 4px; font-size: 11px; padding: 0 8px; line-height: 18px; }
.add:hover { color: var(--accent); border-color: var(--accent); }
/* Just right of the lane, so it reads as a value on the line rather than a part. */
.nwrap { position: relative; max-width: 100%; display: flex; }
.nphot { position: absolute; top: calc(100% + 2px); left: calc(50% + 6px); white-space: nowrap; z-index: 2; pointer-events: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.2; }
.nphot i, .nstage i { font-family: var(--font-display); }
.nstage { font-variant-numeric: tabular-nums; }
.noisebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; }
.noisebar label { display: inline-flex; align-items: center; gap: 6px; }
.noisebar input { width: 3.6em; padding: 4px 6px; text-align: right; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; }
.noisebar input[aria-invalid="true"] { border-color: var(--warn-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); padding-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }

/* Side panel */
aside.panel { position: fixed; z-index: 5; top: 0; right: 0; bottom: 0; width: min(360px, 100vw); overflow-y: auto; align-content: start; display: grid; gap: 12px; background: var(--surface); border-left: 1px solid var(--rule); box-shadow: -8px 0 24px color-mix(in srgb, var(--ink) 18%, transparent);
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) 14px; }
aside.panel h2 { font-size: 18px; }
.field { display: grid; gap: 4px; }
.field label { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); }
.field textarea { min-height: 60px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ro dt { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ro dd { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Changes and history */
.changes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.changes li { padding-left: 18px; position: relative; overflow-wrap: anywhere; }
.changes li::before { position: absolute; left: 0; font-weight: 700; }
.changes li.add::before { content: "+"; color: var(--add); }
.changes li.remove::before { content: "−"; color: var(--del); }
.changes li.change::before { content: "~"; color: var(--accent); }
.history { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.ver { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 14px; padding: 14px 16px; border-top: 1px solid var(--rule); align-items: start; }
.ver:first-child { border-top: 0; }
.ver .num { font-variant-numeric: tabular-nums; font-family: var(--font-display); font-size: 14px; font-weight: 600; padding-top: 2px; }
.ver .msg { font-weight: 600; overflow-wrap: anywhere; }
.ver .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ver .meta img { width: 18px; height: 18px; border-radius: 50%; }
.ver .notes { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ver .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.ver details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.ver .body { grid-column: 2 / 4; display: grid; gap: 6px; min-width: 0; }
@media (max-width: 600px) { .ver { grid-template-columns: 1fr; } .ver .body { grid-column: 1; } .ver .acts { justify-content: flex-start; } }
.cur-tag { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 1px 6px; border-radius: 3px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; z-index: 10; font-size: 13px; }
/* File viewer: the frame cannot open the page's own files in a new tab, so they open here. */
.viewer { position: fixed; inset: 0; z-index: 20; display: flex; align-items: stretch; justify-content: center; background: color-mix(in srgb, var(--ink) 55%, transparent);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); }
.viewer-box { width: min(980px, 100%); display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--surface); border-radius: 8px; overflow: hidden; }
.viewer-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.viewer-head h2 { font-size: 17px; overflow-wrap: anywhere; min-width: 0; }
.viewer-body { overflow: auto; background: var(--bg); padding: 12px; display: grid; gap: 12px; justify-items: center; align-content: start; }
.viewer-body canvas, .viewer-body img { max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 4px color-mix(in srgb, var(--ink) 25%, transparent); }
.viewer-body .text { white-space: pre-wrap; overflow-wrap: anywhere; width: 100%; max-width: 80ch; background: var(--surface); padding: 12px 14px; border-radius: 6px; }
.viewer-body .linkbox { width: 100%; max-width: 70ch; display: grid; gap: 12px; padding: 12px 0; }
.viewer-body .linkbox p { margin: 0; }
.viewer-body .linkbox a.btn { text-decoration: none; color: var(--ink); }
.viewer-body .msg { color: var(--muted); padding: 40px 12px; text-align: center; }
footer.foot #footsrc { display: grid; gap: 4px; min-width: 0; }
.vfiles { overflow-wrap: anywhere; }
.vfiles a { color: var(--accent); }
footer.foot { margin-top: 20px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; }
@media (prefers-reduced-motion: no-preference) { .chip, .btn { transition: border-color .12s, box-shadow .12s; } }
</style>

<header class="top">
  <div>
    <h1>Slab Kiutra Wiring Log</h1>
  </div>
  <div class="status" id="status"><span class="pill"><span class="dot"></span>Loading…</span></div>
</header>
<nav class="bar">
  <div class="seg" role="group" aria-label="View">
    <button id="tab-diagram" aria-pressed="true">Diagram</button>
    <button id="tab-history" aria-pressed="false">History</button>
  </div>
  <div class="seg" role="group" aria-label="Lines shown" id="groupseg">
    <button data-g="all" aria-pressed="true">All lines</button>
    <button data-g="dc" aria-pressed="false">DC</button>
    <button data-g="rf" aria-pressed="false">RF</button>
  </div>
  <div class="noisebar" id="noisebar"></div>
  <div class="actions" id="topactions"></div>
</nav>
<div id="banners"></div>
<main id="main"></main>
<footer class="foot">
  <span id="footsrc"></span>
  <span><button class="btn small" id="export">Export history (JSON)</button> <label class="btn small" id="importlbl" hidden>Import JSON<input type="file" id="import" accept="application/json,.json" hidden></label></span>
</footer>
<div class="toast" id="toast" hidden></div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer-box">
    <div class="viewer-head">
      <h2 id="viewer-title"></h2>
      <span class="actions"><button class="btn small" id="viewer-save" hidden>Save a copy</button><button class="btn small" id="viewer-close">Close</button></span>
    </div>
    <div class="viewer-body" id="viewer-body"></div>
  </div>
</div>

<script>
"use strict";
// ---------- Baseline from the vendor drawings ----------
const STAGES = [
  { id: "rt", name: "300 K", sub: "Top plate" },
  { id: "k40", name: "40 K", sub: "Plate" },
  { id: "k4", name: "4 K", sub: "Plate" },
  { id: "sh4", name: "4 K", sub: "Shield" },
  { id: "guard", name: "Guard", sub: "250 mK" },
  { id: "sample", name: "Sample stage", sub: "50 mK" },
  { id: "puck", name: "Puck", sub: "50 mK" },
];
const TYPES = {
  connector: "Connector", cable: "Cable", attenuator: "Attenuator", filter: "Filter",
  amplifier: "Amplifier", isolator: "Circulator / isolator", coupler: "Directional coupler",
  diplexer: "Diplexer", splitter: "Splitter / combiner", anchor: "Thermal anchor", other: "Other",
};
// Parts with more than two ports: another line can connect into one of them.
const MULTIPORT = new Set(["isolator", "coupler", "diplexer", "splitter", "other"]);

function localBackend() {

  return {

    start(cb) { versionFiles = files.slice(); cb(list.length ? list.slice().sort((a, b) => b.n - a.n) : [baselineVersion()]); },
    async addFile(f) { files.push(f); saveFiles(); },

    async removeFile(id) { files = files.filter((f) => f.id !== id); saveFiles(); },

    updateFile: (id, patch) => fcol.doc(id).update(patch),
    removeFile: (id) => fcol.doc(id).delete(),

        (snap) => { if (snap.empty && snap.metadata.fromCache) return; cb(snap.empty ? [baselineVersion()] : snap.docs.map((d) => d.data())); },

    mode: "github", canWrite: false,

async function exportDiagramImage(e) {

    await html2imgReady;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const { g } = lastDiagram;

    let canvas;

      canvas = await window.html2canvas(g, {

async function importHistory(file) {
